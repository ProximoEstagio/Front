<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Próximo Estágio — Secretaria</title>
    <link rel="stylesheet" href="../../public/global.css" />
    <link rel="stylesheet" href="estilos/secretaria.css" />
    <link rel="stylesheet" href="../professor/estilos/lista.css" />
    <link
      rel="icon"
      href="../../public/imagens/favicon.png"
      type="image/x-icon"
    />

    <script src="../../public/script/config.js"></script>
    <script src="../../public/script/api.js"></script>
    <script src="../../public/script/requireLogin.js"></script>
    <script src="scripts/nav.js" defer></script>
    <script src="../../public/script/acessibilidade.js" defer></script>
    <script src="../../public/script/script.js" defer></script>
    <script src="../../public/script/logout.js" defer></script>
    <script src="scripts/secretaria.js" defer></script>
  </head>
  <body>
    <nav></nav>

    <div class="content cl">
      <!-- Dashboard -->
      <div class="container topC rw g16">
        <p class="TopTxt">Alunos Concluídos</p>
        <p id="total-concluidos" class="TopTxt"></p>
      </div>

      <!-- Filtro por curso -->
      <div class="container cl">
        <div class="topV rw g16">
          <p class="TopTxt">Filtrar por Curso</p>
        </div>
        <div class="rw p16 g16" id="filtros-curso"></div>
      </div>

      <!-- Lista -->
      <div class="g16 cl">
        <table class="container topC">
          <colgroup>
            <col style="width: 25%" />
            <col style="width: 15%" />
            <col style="width: 30%" />
            <col style="width: 20%" />
            <col style="width: 10%" />
          </colgroup>
          <thead>
            <tr>
              <th><p>Nome</p></th>
              <th><p>R.A.</p></th>
              <th><p>Email</p></th>
              <th><p>Curso</p></th>
              <th><p>Docs</p></th>
            </tr>
          </thead>
        </table>
        <div class="tabela-alunos">
          <table>
            <colgroup>
              <col style="width: 25%" />
              <col style="width: 15%" />
              <col style="width: 30%" />
              <col style="width: 20%" />
              <col style="width: 10%" />
            </colgroup>
            <tbody id="lista-concluidos">
              <tr>
                <td colspan="5" style="text-align: center; padding: 32px">
                  Carregando...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
